/* 搜索增强：命中境界关键词（练气/筑基/金丹/元婴/化神/飞升/凡人/突破）时自动切到「修为丹药」页 */
const realmSearchMap = [
  {kw:"凡人", realm:"凡人"}, {kw:"练气", realm:"练气期"}, {kw:"筑基", realm:"筑基期"},
  {kw:"金丹", realm:"金丹期"}, {kw:"元婴", realm:"元婴期"}, {kw:"化神", realm:"化神期"},
  {kw:"飞升", realm:"化神期"}, {kw:"突破", realm:null}, {kw:"境界", realm:null}, {kw:"修为", realm:null},
];
function handleRealmSearch(q){
  if(!q) return false;
  let hit = null;
  for(const m of realmSearchMap){
    if(q.includes(m.kw)){ hit = m; break; }
  }
  if(!hit) return false;
  showTab("realms");
  if(hit.realm){ realmFilter = hit.realm; }
  else {
    // 搜索"突破/境界/修为"：显示所有境界卡片（突破丹药高亮）
    realmFilter = "全部";
  }
  renderRealmChips(); renderRealmPath(); renderRealms();
  return true;
}

      $("search").value = name;
      renderAlchemy();
      toast(`「${name}」的丹方如下`);
      window.scrollTo({top:0, behavior:"smooth"});
      return;
    }
    if(!ing) return;
    showTab("materials");
    matFilter = "全部"; renderMatChips();
    $("search").value = name;
    renderMaterials();
    const found = materials.some(m=>m.name===name) || spiritPlants.includes(name) || /^[一二三四五六七八九]阶妖丹$/.test(name) || pills.includes(name);
    toast(found ? `已按「${name}」筛选材料` : `「${name}」为配方产物/原版物品，可继续搜索或返回配方页查看`);
    window.scrollTo({top:0, behavior:"smooth"});
  }
});

let toastTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 1600);
}

/* 初始化 */
$("verTag").textContent = VERSION;
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{showTab(b.dataset.tab);renderAll()});
$("search").addEventListener("input", ()=>{
  $("clearBtn").style.display = $("search").value? "block":"none";
  const q = $("search").value.trim();
  if(handleRealmSearch(q)){
    renderAll();
    return;
  }
  renderAll();
});
$("clearBtn").onclick = ()=>{ $("search").value=""; $("clearBtn").style.display="none"; renderAll(); toast("已清除搜索"); };
renderAlchemyChips(); renderRefineChips(); renderMatChips(); renderRealmChips(); renderRealmPath();
showTab("realms"); renderAll();
</script>
</body>
